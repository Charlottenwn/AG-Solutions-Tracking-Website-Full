name: CI #testing push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: self-hosted

    steps:
      - name: Checkout (clean copy — only what's actually committed)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Verify Ruff installation
        run: python -m ruff --version

      - name: Lint with Ruff (advisory)
        shell: powershell
        run: |
          python -m ruff check .
          $ruffExit = $LASTEXITCODE

          if ($ruffExit -ne 0) {
            Write-Host "::warning title=Ruff::Ruff exited with errors. Please check the output above."
          }
          else {
            Write-Host "Ruff lint passed."
          }

          exit 0

      - name: Check formatting with Ruff (advisory)
        shell: powershell
        run: |
          python -m ruff format --check .
          $ruffExit = $LASTEXITCODE

          if ($ruffExit -ne 0) {
            Write-Host "::warning title=Ruff Formatting::Ruff formatting issues detected. Please check the output above."
          }
          else {
            Write-Host "Ruff formatting passed."
          }

          exit 0

      - name: Install dependency audit tools
        run: python -m pip install pip-audit uv

      - name: Audit dependencies for known vulnerabilities (advisory)
        shell: powershell
        run: |
          python -m uv export --frozen --no-dev --no-hashes --no-emit-project -o audit-requirements.txt
          python -m pip_audit -r audit-requirements.txt --no-deps
          $auditExit = $LASTEXITCODE

          if ($auditExit -ne 0) {
            Write-Host "::warning title=pip-audit::Known vulnerabilities found. Please check the output above."
          }
          else {
            Write-Host "Dependency audit passed."
          }

          exit 0

  build-check:
    needs: quality
    runs-on: self-hosted

    steps:
      - name: Checkout (clean copy — only what's actually committed)
        uses: actions/checkout@v4
        
      - name: Create dummy secrets for CI (never touches real Bitwarden secrets)
        run: |
          mkdir -p secrets
          Set-Content -Path secrets/django_secret_key.txt -Value "ci-fake-secret-key-not-for-production" -Encoding ascii -NoNewline
          Set-Content -Path secrets/postgres_user.txt -Value "ci_user" -Encoding ascii -NoNewline
          Set-Content -Path secrets/postgres_password.txt -Value "ci_password" -Encoding ascii -NoNewline
          Set-Content -Path secrets/postgres_db.txt -Value "ci_db" -Encoding ascii -NoNewline
          Set-Content -Path secrets/google_sheets_key.json -Value "{}" -Encoding ascii -NoNewline
          Set-Content -Path secrets/google_sheet_id.json -Value '{"sheet_id": "ci-fake"}' -Encoding ascii -NoNewline
          Set-Content -Path secrets/seven_api_key.txt -Value "ci-fake-api-key" -Encoding ascii -NoNewline
          Set-Content -Path secrets/ntfy_user.txt -Value "ci-ntfy-user" -Encoding ascii -NoNewline
          Set-Content -Path secrets/ntfy_password.txt -Value "ci-ntfy-password" -Encoding ascii -NoNewline
          Set-Content -Path secrets/ntfy_user_mz.txt -Value "ci-fake-user_mz" -Encoding ascii -NoNewline
          Set-Content -Path secrets/ntfy_user_vp.txt -Value "ci-fake-user_vp" -Encoding ascii -NoNewline
          Set-Content -Path secrets/ntfy_password_mz.txt -Value "ci-fake-password_mz" -Encoding ascii -NoNewline
          Set-Content -Path secrets/ntfy_password_vp.txt -Value "ci-fake-password_vp" -Encoding ascii -NoNewline
          Set-Content -Path secrets/.htpasswd -Value "" -Encoding ascii -NoNewline
          Set-Content -Path secrets/VAPID_priv_key.txt -Value "ci-fake-vapid-priv" -Encoding ascii -NoNewline
         # Set-Content -Path secrets/keepalive_phone_number.txt -Value "ci-fake-phone" -Encoding ascii -NoNewline
        # COMMENTED OUT SINCE 2026-08-24 (Seven API support confirmed that inactivity doesn't change anything-
        # keeping code as is for potential future use. See email for more details.

      - name: Verify dummy secrets look correct
        run: |
          Get-Content secrets/postgres_user.txt
          Get-Content secrets/postgres_db.txt
          Get-Content secrets/postgres_password.txt
          Get-Content secrets/seven_api_key.txt
          Get-Content secrets/ntfy_user.txt
          Get-Content secrets/ntfy_password.txt
          Get-Content secrets/ntfy_user_mz.txt
          Get-Content secrets/ntfy_user_vp.txt
          Get-Content secrets/ntfy_password_mz.txt
          Get-Content secrets/ntfy_password_vp.txt
          Get-Content secrets/.htpasswd
          Get-Content secrets/VAPID_priv_key.txt
         # Get-Content secrets/keepalive_phone_number.txt
          
      - name: Create dummy env files for CI (never touches real .env.dev/.env.db)
        run: |
          Set-Content -Path .env-docker/.env.dev -Value "PYTHONUNBUFFERED=1`nDEBUG=True`nDJANGO_ALLOWED_HOSTS=localhost,127.0.0.1" -Encoding ascii
          Set-Content -Path .env-docker/.env.db -Value "POSTGRES_USER_FILE=/run/secrets/postgres_user.txt`nPOSTGRES_PASSWORD_FILE=/run/secrets/postgres_password.txt`nPOSTGRES_DB_FILE=/run/secrets/postgres_db.txt" -Encoding ascii

      - name: Build all service images from a clean checkout
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml build
        
      - name: Verify Django can load all apps (catches missing/untracked files)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml run --rm web python manage.py check

      - name: Show db logs on failure (debugging)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml logs db

      - name: Verify migrations are consistent with models
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml run --rm web python manage.py makemigrations --check --dry-run

      - name: Show migration logs on failure (debugging)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml logs migrate

      - name: Run test suite with coverage
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml run --rm web sh -c "uv sync --frozen && python -m pytest"

      - name: Show db logs on test failure (debugging)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml logs db

      - name: Scan web image with Trivy (advisory)
        shell: powershell
        run: |
          $image = docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml config --images | Where-Object { $_ -like "*-web" } | Select-Object -First 1
          Write-Host "Scanning image: $image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 $image
          exit 0
          
      - name: Clean up any containers left behind
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml down -v