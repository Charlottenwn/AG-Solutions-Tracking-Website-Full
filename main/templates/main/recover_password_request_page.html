{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#111827';
        } else {
            document.documentElement.style.backgroundColor = '#f3f4f6';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @variant dark (&:where(.dark, .dark *));
</style>
    <title>Recover Password — AG Solutions</title>
</head>

<body class="min-h-screen bg-gray-100 dark:bg-gray-900 flex flex-col text-sm transition-colors duration-200">
    <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-5xl mx-auto px-6 flex items-center justify-between">
            <span class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-widest py-4">AG
                Solutions</span>
            <button id="darkToggle" class="text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
                </svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.07-6.07-.71.71M6.34 17.66l-.71.71m12.73 0-.71-.71M6.34 6.34l-.71-.71M12 5a7 7 0 1 1 0 14A7 7 0 0 1 12 5z" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-6 py-12">
        <div
            class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-8 w-full max-w-sm">
            <p class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">
                Recover password
            </p>
            <p class="text-xs text-gray-400 dark:text-gray-500 mb-6">
                Enter your username. We'll text a recovery code to the phone number on file.
            </p>

            {% if error %}
            <p class="text-xs text-red-600 dark:text-red-400 mb-4">{{ error }}</p>
            {% endif %}

            <form method="post" action="{% url 'recover_password_verify_page' %}" class="flex flex-col gap-4">
                {% csrf_token %}
                <div class="flex flex-col gap-1.5">
                    <label for="username" class="text-gray-500 dark:text-gray-400">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full border border-gray-400 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded px-3 py-1.5" />
                </div>
                <button type="submit"
                    class="mt-2 w-full bg-gray-900 hover:bg-gray-700 text-white text-center font-medium py-2 rounded-lg transition-colors cursor-pointer">
                    Send code
                </button>
            </form>

            <a href="/login_page/"
                class="block mt-4 text-xs text-gray-400 dark:text-gray-500 hover:text-gray-700 dark:hover:text-gray-200">
                Back to login
            </a>
        </div>
    </main>

    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <p class="text-xs text-gray-400 dark:text-gray-500 text-center">
                &copy; 2026 AG Solutions UAB. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="{% static 'main/js/darkmode.js' %}"></script>
</body>

</html>
