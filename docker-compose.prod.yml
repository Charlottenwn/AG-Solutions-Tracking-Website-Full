services:

  bws_init:
    build: ./bws
    volumes:
      - ./secrets/bws_token.txt:/secrets/bws_token.txt:ro
      - runtime_secrets:/runtime-secrets
    restart: "no"

  migrate:
    volumes:
      - runtime_secrets:/app/secrets:ro
    env_file:
      - .env-docker/.env.prod
    depends_on:
      bws_init:
        condition: service_completed_successfully
    restart: "no"

  web:
    volumes:
      - static_volume:/app/staticfiles
      - runtime_secrets:/app/secrets:ro
    env_file:
      - .env-docker/.env.prod
    depends_on:
      bws_init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    volumes:
      - postgres_data:/var/lib/postgresql
      - runtime_secrets:/run/secrets:ro
    env_file:
      - .env-docker/.env.db
    depends_on:
      bws_init:
        condition: service_completed_successfully
    restart: unless-stopped

  celery_worker:
    volumes:
      - runtime_secrets:/app/secrets:ro
    env_file:
      - .env-docker/.env.prod
    restart: unless-stopped

  celery_beat:
    volumes:
      - runtime_secrets:/app/secrets:ro
    env_file:
      - .env-docker/.env.prod
    restart: unless-stopped

  nginx:
    volumes:
      - static_volume:/static
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - runtime_secrets:/etc/nginx/secrets:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
    restart: unless-stopped

  ntfy:
    volumes:
      - ntfy_data:/var/lib/ntfy
      - ./ntfy/server.yml:/etc/ntfy/server.yml.template:ro
      - ntfy_config:/etc/ntfy
      - runtime_secrets:/run/secrets:ro
      - ./certs:/etc/ntfy/certs:ro
    env_file:
      - .env-docker/.env.ntfy
    entrypoint: >
      sh -c "sed 's|__VAPID_PRIVATE_KEY__|'$$(cat /run/secrets/VAPID_priv_key.txt)'|' /etc/ntfy/server.yml.template > /etc/ntfy/server.yml && exec ntfy serve --config /etc/ntfy/server.yml"
    restart: unless-stopped
