services:

  web:
    build: .

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_SHEETS_CREDENTIALS_PATH=/app/secrets/google_sheets_key.json
      - GOOGLE_SHEET_ID_PATH=/app/secrets/google_sheet_id.json
      - DEBUG=1

    depends_on:
      - db


  db:
    image: postgres:18

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./secrets:/run/secrets:ro

    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user.txt
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password.txt
      - POSTGRES_DB_FILE=/run/secrets/postgres_db.txt

    ports:
      - "5432:5432"


  nginx:
    image: nginx

volumes:
  postgres_data: