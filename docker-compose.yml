services:

  web:
    build: .

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    environment:
      - GOOGLE_SHEETS_CREDENTIALS_PATH=/app/secrets/google_sheets_key.json
      - GOOGLE_SHEET_ID_PATH=/app/secrets/google_sheet_id.json
      - DEBUG=1

    depends_on:
      - db


  db:
    image: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets:/run/secrets:ro

    ports:
      - "5432:5432"


  nginx:
    image: nginx

volumes:
  postgres_data: